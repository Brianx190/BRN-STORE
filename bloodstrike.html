<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blood Strike - BRN STORE</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
    body{background:#0b0b0b;color:#fff;min-height:100vh}
    header{background:#111;padding:18px 20px;border-bottom:1px solid #252525;display:flex;align-items:center;justify-content:space-between}
    header h1{font-size:22px;font-weight:800}
    .back{color:#fff;text-decoration:none;background:#222;padding:10px 15px;border-radius:8px;font-size:14px}
    .hero{width:100%;min-height:230px;display:flex;align-items:flex-end;padding:25px;background:linear-gradient(to top,#0b0b0b,transparent),url("assets/bloodstrike.jpg") center/cover no-repeat}
    .hero h2{font-size:32px;font-weight:900}
    .container{width:100%;max-width:900px;margin:auto;padding:20px}
    .info,.player-id{background:#151515;border-radius:12px;padding:18px;margin-bottom:20px}
    .info h3{margin-bottom:8px}
    .info p{color:#aaa;font-size:14px;line-height:1.5}
    .player-id label{display:block;margin-bottom:8px;font-weight:bold}
    .player-id input{width:100%;padding:13px;background:#0d0d0d;border:1px solid #333;color:#fff;border-radius:8px;outline:none}
    .packages{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:15px}
    .package{background:#151515;border:1px solid #292929;border-radius:12px;padding:18px}
    .package h3{font-size:18px;margin-bottom:8px}
    .price{font-size:20px;font-weight:bold;margin-bottom:15px}
    .buy{display:block;width:100%;text-align:center;text-decoration:none;color:#fff;background:#e50914;padding:11px;border-radius:8px;font-weight:bold}
    .buy:hover{background:#ff1b26}
    footer{text-align:center;color:#666;padding:30px 15px;font-size:13px}
  </style>
</head>
<body>
  <header>
    <h1>BRN STORE</h1>
    <a href="index.html" class="back">← Volver</a>
  </header>

  <section class="hero">
    <h2>Blood Strike</h2>
  </section>

  <main class="container">
    <div class="info">
      <h3>Blood Strike</h3>
      <p>Selecciona el paquete que deseas comprar.</p>
    </div>

    <div class="player-id">
      <label for="playerId">ID de jugador</label>
      <input type="text" id="playerId" placeholder="Escribe tu ID de Blood Strike">
    </div>

    <div class="packages">
      <div class="package">
        <h3>100 Gold</h3><div class="price">$1.00</div>
        <a class="buy" href="https://wa.me/?text=Hola%20BRN%20STORE%2C%20quiero%20comprar%20100%20Gold%20de%20Blood%20Strike." target="_blank">Comprar</a>
      </div>
      <div class="package">
        <h3>500 Gold</h3><div class="price">$5.00</div>
        <a class="buy" href="https://wa.me/?text=Hola%20BRN%20STORE%2C%20quiero%20comprar%20500%20Gold%20de%20Blood%20Strike." target="_blank">Comprar</a>
      </div>
      <div class="package">
        <h3>1000 Gold</h3><div class="price">$10.00</div>
        <a class="buy" href="https://wa.me/?text=Hola%20BRN%20STORE%2C%20quiero%20comprar%201000%20Gold%20de%20Blood%20Strike." target="_blank">Comprar</a>
      </div>
      <div class="package">
        <h3>2000 Gold</h3><div class="price">$20.00</div>
        <a class="buy" href="https://wa.me/?text=Hola%20BRN%20STORE%2C%20quiero%20comprar%202000%20Gold%20de%20Blood%20Strike." target="_blank">Comprar</a>
      </div>
    </div>
  </main>

  <footer>© 2026 BRN STORE — Todos los derechos reservados.</footer>
</body>
</html>
